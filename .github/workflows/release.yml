# On a v<version> tag: runs the unit tests, builds both installers with installer\build_installer.bat
# and publishes them as a GitHub Release. Manual runs build and keep the installers as a workflow artifact only.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check that the tag matches version.py
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(python -c "from version import __version__; print(__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version.py ($version)"
            exit 1
          fi

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Unit tests
        run: python -m unittest discover -p "test_*.py" -v

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installers
        shell: cmd
        env:
          PYTHON: python
        run: installer\build_installer.bat

      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: installer/Output/*.exe

      - name: Publish the release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" installer/Output/*.exe --title "$GITHUB_REF_NAME" --generate-notes
